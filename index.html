<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorteo Golden Room</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f3f3f3;
padding:20px;
margin:0;
}

h1{
text-align:center;
font-size:45px;
margin-bottom:10px;
}

.info{
text-align:center;
font-size:25px;
font-weight:bold;
margin-bottom:20px;
}

.barra{
width:100%;
height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:30px;
}

.progreso{
height:100%;
width:0%;
background:#22c55e;
transition:0.3s;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.numero{
padding:25px;
border-radius:20px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
transition:0.2s;
}

.numero:hover{
transform:scale(1.02);
}

.numero h2{
margin:0;
font-size:38px;
}

.estado{
margin-top:10px;
font-size:20px;
font-weight:bold;
}

.nombre{
margin-top:10px;
font-size:18px;
}

.libre{
background:#dff1e3;
}

.ocupado{
background:#f8dede;
cursor:not-allowed;
}

/* MODAL */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:30px;
border-radius:20px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
font-size:18px;
border-radius:10px;
border:1px solid #ccc;
margin-top:15px;
box-sizing:border-box;
}

.botones{
margin-top:20px;
display:flex;
gap:10px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.reservar{
background:#22c55e;
color:white;
}

.cancelar{
background:#ddd;
}

</style>
</head>

<body>

<h1>Selecciona tu número</h1>

<div class="info">
<span id="contador">0</span> / 50 números reservados
</div>

<div class="barra">
<div class="progreso" id="progreso"></div>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Reservar número</h2>

<p>Número seleccionado:</p>

<h1 id="numeroSeleccionado">00</h1>

<input type="text" id="nombre" placeholder="Escribe tu nombre">

<div class="botones">

<button class="reservar" onclick="reservarNumero()">
Reservar
</button>

<button class="cancelar" onclick="cerrarModal()">
Cancelar
</button>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
'https://owgbgpzfymrccbxgtfqc.supabase.co';

const SUPABASE_KEY =
'sb_publishable_aqJ5f9hDU9H6oy9dVD18Cw_7rIZxuQi';

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const grid=document.getElementById("grid");

const modal=document.getElementById("modal");

let numeroSeleccionado=null;

let numeroDiv=null;

async function cargarNumeros(){

grid.innerHTML='';

const { data, error } =
await supabaseClient
.from('numeros')
.select('*')
.order('numero');

if(error){
console.log(error);
return;
}

data.forEach(item=>{

const div=document.createElement("div");

div.className=
item.estado === 'ocupado'
? 'numero ocupado'
: 'numero libre';

div.innerHTML=`
<h2>${String(item.numero).padStart(2,'0')}</h2>
<div class="estado">
${item.estado.toUpperCase()}
</div>
<div class="nombre">
${item.nombre || ''}
</div>
`;

div.onclick=()=>{

if(item.estado === 'ocupado'){
return;
}

numeroSeleccionado=item.numero;

numeroDiv=div;

document.getElementById("numeroSeleccionado")
.innerText=
String(item.numero).padStart(2,'0');

modal.style.display='flex';

}

grid.appendChild(div);

});

actualizarBarra(data);

}

function cerrarModal(){

modal.style.display='none';

document.getElementById("nombre").value='';

}

async function reservarNumero(){

const nombre=
document.getElementById("nombre").value;

if(nombre.trim()===''){
alert('Escribe tu nombre');
return;
}

await supabaseClient
.from('numeros')
.update({
estado:'ocupado',
nombre:nombre
})
.eq('numero',numeroSeleccionado);

cerrarModal();

cargarNumeros();

}

function actualizarBarra(data){

const ocupados=
data.filter(n=>n.estado==='ocupado').length;

document.getElementById("contador")
.innerText=ocupados;

const porcentaje=(ocupados/50)*100;

document.getElementById("progreso")
.style.width=porcentaje+'%';

}

cargarNumeros();

</script>

</body>
</html>
