<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorteo Golden Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f3f3f3;
padding:20px;
margin:0;
}

h1{
text-align:center;
font-size:45px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:30px;
}

.numero{
padding:25px;
border-radius:20px;
text-align:center;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.numero h2{
margin:0;
font-size:38px;
}

.libre{
background:#dff1e3;
}

.ocupado{
background:#f8dede;
cursor:not-allowed;
}

.nombre{
margin-top:10px;
font-size:18px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:30px;
border-radius:20px;
width:300px;
text-align:center;
}

input{
width:100%;
padding:12px;
font-size:18px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:15px;
width:100%;
}

.reservar{
background:#22c55e;
color:white;
}

.cancelar{
background:#ddd;
}

</style>

</head>

<body>

<h1>Selecciona tu número</h1>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">

<div class="modal-content">

<h2>Reservar número</h2>

<h1 id="numeroTexto">00</h1>

<input type="text" id="nombre" placeholder="Escribe tu nombre">

<button class="reservar" onclick="reservar()">
Reservar
</button>

<button class="cancelar" onclick="cerrarModal()">
Cancelar
</button>

</div>

</div>

<script>

const supabaseUrl =
'https://owgbgpzfymrccbxgtfqc.supabase.co';

const supabaseKey =
'https://owgbgpzfymrccbxgtfqc.supabase.co';

const client =
supabase.createClient(
supabaseUrl,
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Z2JncHpmeW1yY2NieGd0ZnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTE1NzYsImV4cCI6MjA5NDk4NzU3Nn0.wHXXy9BScxrXunIxL38WgbyqbOClGHM9o67S7rtNrJc'
);

const grid =
document.getElementById("grid");

const modal =
document.getElementById("modal");

let numeroActual = null;

async function cargar(){

grid.innerHTML='';

const { data, error } =
await client
.from('numeros')
.select('*')
.order('numero');

console.log(data);
console.log(error);

if(error){
alert('Error conectando con Supabase');
return;
}

data.forEach(item=>{

const div =
document.createElement('div');

div.className =
item.estado === 'ocupado'
? 'numero ocupado'
: 'numero libre';

div.innerHTML = `
<h2>${item.numero}</h2>
<div>${item.estado}</div>
<div class="nombre">${item.nombre || ''}</div>
`;

div.onclick = ()=>{

if(item.estado === 'ocupado'){
return;
}

numeroActual = item.numero;

document.getElementById("numeroTexto")
.innerText = item.numero;

modal.style.display='flex';

};

grid.appendChild(div);

});

}

function cerrarModal(){

modal.style.display='none';

}

async function reservar(){

const nombre =
document.getElementById("nombre").value;

if(nombre===''){
alert('Escribe tu nombre');
return;
}

await client
.from('numeros')
.update({
estado:'ocupado',
nombre:nombre
})
.eq('numero',numeroActual);

cerrarModal();

cargar();

}

cargar();

</script>

</body>

</html>
